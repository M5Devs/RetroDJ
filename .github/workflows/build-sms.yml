name: SMS / Game Gear Build

on:
  push:
    branches: [ main ]
    paths:
      - 'targets/sms/**'
      - 'backends/**'
      - 'core/**'
      - 'drivers/sn76489/**'
      - '.github/workflows/build-sms.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'targets/sms/**'
      - 'backends/**'
      - 'core/**'
      - 'drivers/sn76489/**'
      - '.github/workflows/build-sms.yml'
  workflow_dispatch:

jobs:

  build-sms:
    name: SMS / Game Gear ROM (SDCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDCC
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      # Each variant builds into its own object directory, so both can be built
      # from a single tree without cleaning in between.
      - name: Build Master System ROM
        run: |
          make -C targets/sms/
          mkdir -p dist
          cp targets/sms/out/rom.sms dist/rom.sms

      - name: Build Game Gear ROM
        run: |
          make -C targets/sms/ GG=1
          mkdir -p dist
          cp targets/sms/out/rom.gg dist/rom.gg

      - name: Verify ROM Output
        run: |
          ok=1
          for rom in dist/rom.sms dist/rom.gg; do
            if [ -f "$rom" ]; then
              echo "Successfully generated $rom!"
              ls -la "$rom"
            else
              echo "Error: $rom not found!"
              ok=0
            fi
          done
          [ "$ok" = 1 ]

      # The Game Gear only routes PSG audio to the speakers once I/O port $06
      # (the stereo control register) is written, so the GG image must contain
      # the `out ($06),a` opcode (0xD3 0x06) while the plain SMS image must not.
      - name: Verify PSG Stereo Register
        run: |
          python3 - <<'EOF'
          import sys

          def has_out_port(rom, port):
              data = open(rom, "rb").read()
              return any(data[i] == 0xD3 and data[i + 1] == port
                         for i in range(len(data) - 1))

          gg = has_out_port("dist/rom.gg", 0x06)
          sms = has_out_port("dist/rom.sms", 0x06)
          print("rom.gg writes GG stereo port $06:", gg)
          print("rom.sms writes port $06 (should be False):", sms)

          if not gg:
              print("Error: rom.gg never enables the Game Gear stereo register; "
                    "PSG output would be silent on hardware.")
              sys.exit(1)
          if sms:
              print("Error: rom.sms unexpectedly writes I/O port $06.")
              sys.exit(1)
          EOF

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: RDJ-sms-rom
          path: |
            dist/rom.sms
            dist/rom.gg
