name: SMS / Game Gear Build

on:
  push:
    branches: [ main ]
    paths:
      - 'targets/sms/**'
      - 'backends/**'
      - 'core/**'
      - 'drivers/sn76489/**'
      - '.github/workflows/build-sms.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'targets/sms/**'
      - 'backends/**'
      - 'core/**'
      - 'drivers/sn76489/**'
      - '.github/workflows/build-sms.yml'
  workflow_dispatch:

jobs:

  build-sms:
    name: SMS / Game Gear ROM (SDCC)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SDCC
        run: |
          sudo apt-get update
          sudo apt-get install -y sdcc

      # The two variants share object files, so each is built from a clean tree
      # and its ROM is staged before the next build cleans the output directory.
      - name: Build Master System ROM
        run: |
          make -C targets/sms/
          mkdir -p dist
          cp targets/sms/out/rom.sms dist/rom.sms

      - name: Build Game Gear ROM
        run: |
          make -C targets/sms/ clean
          make -C targets/sms/ GG=1
          mkdir -p dist
          cp targets/sms/out/rom.gg dist/rom.gg

      - name: Verify ROM Output
        run: |
          ok=1
          for rom in dist/rom.sms dist/rom.gg; do
            if [ -f "$rom" ]; then
              echo "Successfully generated $rom!"
              ls -la "$rom"
            else
              echo "Error: $rom not found!"
              ok=0
            fi
          done
          [ "$ok" = 1 ]

      - name: Upload ROMs
        uses: actions/upload-artifact@v4
        with:
          name: RDJ-sms-rom
          path: |
            dist/rom.sms
            dist/rom.gg
