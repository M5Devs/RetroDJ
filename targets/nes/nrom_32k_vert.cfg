SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100; # 256-byte C stack
}

MEMORY {
    HEADER: start = $0000, size = $0010, fill = yes, file = %O;
    ZP:     start = $0000, size = $0100, type = rw, define = yes;
    # Cartridge WRAM. The 2 KB of console RAM ($0000-$07FF) has to hold the
    # zero page ($0000-$00FF) and the cc65 software stack, which crt0 seeds at
    # $0800 and grows downward; putting writable state here instead keeps the
    # two from overlapping.
    RAM:    start = $6000, size = $2000, type = rw, define = yes;
    PRG:    start = $8000, size = $8000, fill = yes, file = %O, define = yes;
    CHR:    start = $0000, size = $2000, fill = yes, file = %O;
}

SEGMENTS {
    HEADER:    load = HEADER, type = ro;
    ZEROPAGE:  load = ZP,     type = zp;
    BSS:       load = RAM,    type = bss, define = yes;
    CODE:      load = PRG,    type = ro,  define = yes;
    RODATA:    load = PRG,    type = ro,  define = yes;
    # Initialised statics must be writable at run time, so they are loaded from
    # the PRG bank and copied into WRAM by copydata.
    DATA:      load = PRG,    run = RAM,  type = rw,  define = yes;
    ONCE:      load = PRG,    type = ro,  optional = yes;
    VECTORS:   load = PRG,    type = ro,  start = $FFFA;
    CHARS:     load = CHR,    type = ro,  optional = yes;
}

FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
}
